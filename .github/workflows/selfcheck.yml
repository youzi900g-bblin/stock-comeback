name: 遊戲自我檢查

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tests/run-selfcheck.js
