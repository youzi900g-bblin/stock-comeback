name: 遊戲自我檢查

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 遊戲放在 stock 資料夾，GitHub 只讀最外層的 .github
    defaults:
      run:
        working-directory: stock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tests/run-selfcheck.js

  # 自我檢查通過才上線，而且只發布 game 資料夾
  deploy:
    needs: selfcheck
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stock/game
      - id: deploy
        uses: actions/deploy-pages@v4
